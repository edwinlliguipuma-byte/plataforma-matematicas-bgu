<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea Entregada Exitosamente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 font-sans text-slate-100 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-xl w-full bg-white/10 backdrop-blur-md rounded-3xl shadow-2xl p-10 text-center border border-white/20 space-y-6">
        <div class="w-24 h-24 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center text-5xl mx-auto font-bold border border-emerald-500/30 shadow-inner">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        
        <h1 class="text-3xl font-extrabold text-white">¡Tarea Calificada y Entregada!</h1>
        
        <p class="text-lg text-blue-200">
            Estudiante: <strong class="text-white">{{ estudiante.nombre_completo }}</strong>
        </p>
        
        <div class="py-6 bg-slate-900/60 rounded-2xl border border-white/10 shadow-inner">
            <p class="text-sm text-slate-400 uppercase font-bold tracking-wider">Calificación Asignada por la IA</p>
            <p class="text-5xl font-black text-emerald-400 mt-2">{{ nota|floatformat:2 }} <span class="text-2xl text-slate-400">/ 10</span></p>
            <p class="text-xs text-slate-400 mt-2">(Nota mínima garantizada por entrega: 5.00)</p>
        </div>

        <div class="pt-4">
            <a href="{% url 'subir_tarea' tarea.id %}" class="inline-block px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg transition text-base">
                <i class="fa-solid fa-arrow-left mr-2"></i> Volver
            </a>
        </div>
    </div>
</body>
</html>
